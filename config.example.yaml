---  # Serial MCP Server Configuration

serial:
  # Serial port path (e.g., /dev/ttyUSB0, /dev/ttyACM0, COM3)
  port: /dev/ttyUSB0

  # Serial port settings
  baudrate: 115200
  bytesize: 8  # 5, 6, 7, or 8
  parity: "N"  # N (None), E (Even), O (Odd), M (Mark), S (Space)
  stopbits: 1  # 1, 1.5, or 2

  # Timeouts (seconds)
  timeout: 1.0
  write_timeout: 1.0

  # Reconnection settings
  reconnect_delay: 2.0
  max_reconnect_delay: 30.0
  reconnect_backoff_multiplier: 1.5

buffer:
  # Maximum buffer size in megabytes
  max_size_mb: 10

  # Maximum number of lines to store (whichever limit is hit first)
  line_limit: 100000

  # Overflow behavior: "fifo" (drop oldest)
  overflow: "fifo"

server:
  # Server binding
  host: 0.0.0.0
  port: 8443

  # TLS configuration
  tls_cert: "~/.config/yopo/tls/server.crt"
  tls_key: "~/.config/yopo/tls/server.key"

socket:
  # Unix socket path for CLI communication
  # {pid} will be replaced with the MCP server process ID
  path: "~/tmp/ttygeist-{pid}.sock"

logging:
  # Log file path
  file: ttygeist.log

  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Max log file size in MB (0 = no rotation)
  max_size_mb: 50

  # Number of backup files to keep
  backup_count: 3

auth:
  # CSV List of valid API keys
  # Keys can be provided here or via SERIAL_MCP_API_KEYS env var
  api_keys:
    - "your-api-key-1"
    - "your-api-key-2"

  # Header name for API key (use "Authorization" for "Bearer <key>" format)
  header_name: "X-API-Key"
