[project]
name = "ttygeist"
version = "1.0.0"
description = "Model Context Protocol server for serial port communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
ttygeist = "ttygeist.server:main"
ttygeist-cli = "ttygeist.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttygeist*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
