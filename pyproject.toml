[project]
name = "ttygeist"
version = "1.0.0"
description = "Model Context Protocol server for serial port communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
ttygeist = "ttygeist.server:main"
ttygeist-cli = "ttygeist.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttygeist*"]
