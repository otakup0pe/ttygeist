[project]
name = "ttygeist"
version = "1.0.0"
description = "Model Context Protocol server for serial port communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
]
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Jonathan Freedman", email = "jonafree@gmail.com"},
]
keywords = ["mcp", "serial", "serial-port", "model-context-protocol", "pyserial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/otakup0pe/ttygeist"
Repository = "https://github.com/otakup0pe/ttygeist"
Issues = "https://github.com/otakup0pe/ttygeist/issues"

[project.scripts]
ttygeist = "ttygeist.server:main"
ttygeist-cli = "ttygeist.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttygeist*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
